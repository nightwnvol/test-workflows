name: Release guard
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: write
jobs:
  release-guard:
    runs-on: ubuntu-latest
    outputs:
      release_exists: ${{ steps.check-release.outputs.result }}
    # if:startsWith(github.head_ref, 'release/')
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: pr
      - name: Get package.json version from release branch
        id: get-version-package
        run: |
          cd pr
          echo "result=$(npm pkg get version | jq -r .)" >> $GITHUB_OUTPUT
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.12
      - name: Get pyproject.toml version from release branch
        id: get-version-pyproject
        run: |
          cd pr
          echo "result=$(uv version --short)" >> $GITHUB_OUTPUT
      - name: Check version consistency
        id: get-version
        env:
          VERSION_PACKAGE: ${{ steps.get-version-package.outputs.result }}
          VERSION_PYPROJECT: ${{ steps.get-version-pyproject.outputs.result }}
        run: |
          if [ "${VERSION_PACKAGE}" != "${VERSION_PYPROJECT}" ]; then
            echo "::error::Version mismatch between package.json (${VERSION_PACKAGE}) and pyproject.toml (${VERSION_PYPROJECT})."
            exit 1
          fi
          echo "Version is consistent: ${VERSION_PACKAGE}"
          echo "result=${VERSION_PACKAGE}" >> $GITHUB_OUTPUT
      - name: Check existing release
        id: check-release
        uses: actions/github-script@v8
        env:
          TAG: v${{ steps.get-version.outputs.result }}
        with:
          script: |
            const { check_release } = await import('${{ github.workspace }}/main/.github/scripts/release_guard.mjs');
            return await check_release({github, context, core, tag: process.env.TAG});
          result-encoding: string
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Find existing bot comment
        id: find-comment
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: "<!-- Release Guard -->"
      - name: Prepare comment body
        id: prepare-body
        env:
          VERSION: ${{ steps.get-version.outputs.result }}
          RELEASE_EXISTS: ${{ steps.check-release.outputs.result }}
        run: |
          if [ "${RELEASE_EXISTS}" = "true" ]; then
            STATUS="❌ A release with this version already exists on GitHub. Please bump the version with \`npm version\` before merging this PR."
          else
            STATUS="✅ This version is available for release. You can safely merge this PR."
          fi
          {
            echo "result<<EOF"
            printf "<!-- Release Guard -->\n## Release Guard Report\nVersion: \`${VERSION}\`\n${STATUS}\n"
            echo "EOF"
          } >> $GITHUB_OUTPUT
      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ steps.generate-token.outputs.token }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.prepare-body.outputs.result }}
          edit-mode: replace
  check-release-guard:
    needs: release-guard
    if: always()
    runs-on: ubuntu-latest
    env:
      RELEASE_GUARD_RESULT: ${{ needs.release-guard.result }}
      RELEASE_EXISTS: ${{ needs.release-guard.outputs.release_exists }}
    steps:
      - name: Set status check conclusion
        run: |
          # if release-guard is successful and no release exists, mark check as successful
          if [ "${RELEASE_GUARD_RESULT}" = "success" ] && [ "${RELEASE_EXISTS}" = "false" ]; then
            echo "Release guard passed and no existing release found. Marking check as successful."
            exit 0
          else
            echo "::error::Release guard failed or release already exists. Marking check as failed."
            exit 1
          fi
