name: Release guard
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: write
jobs:
  release-guard:
    runs-on: ubuntu-latest
    outputs:
      release_exists: ${{ steps.check-release.outputs.result }}
    # if:startsWith(github.head_ref, 'release/')
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Get package.json version from release branch
        id: get-version
        uses: actions/github-script@v8
        with:
          script: |
            const { get_pr_package_version } = await import('${{ github.workspace }}/.github/scripts/utils.mjs');
            return await get_pr_package_version({github, context, core, ref: context.payload.pull_request.head.ref});
          result-encoding: string
      - name: Check existing releases
        id: check-release
        uses: actions/github-script@v8
        env:
          TAG: v${{ steps.get-version.outputs.result }}
        with:
          script: |
            const { check_release } = await import('${{ github.workspace }}/.github/scripts/release_guard.mjs');
            return await check_release({github, context, core, tag: process.env.TAG});
          result-encoding: string
      - name: Comment on PR
        uses: actions/github-script@v8
        env:
          VERSION: ${{ steps.get-version.outputs.result }}
          RELEASE_EXISTS: ${{ steps.check-release.outputs.result }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const { comment_on_pr } = await import('${{ github.workspace }}/.github/scripts/release_guard.mjs');
            await comment_on_pr({github, context, core, version: process.env.VERSION, release_exists: process.env.RELEASE_EXISTS === 'true'});
  check-release-guard:
    needs: release-guard
    if: always()
    runs-on: ubuntu-latest
    env:
      RELEASE_GUARD_RESULT: ${{ needs.release-guard.result }}
      RELEASE_EXISTS: ${{ needs.release-guard.outputs.release_exists }}
    steps:
      - name: Set status check conclusion
        run: |
          # if release-guard is successful and no release exists, mark check as successful
          if [ "${RELEASE_GUARD_RESULT}" = "success" ] && [ "${RELEASE_EXISTS}" = "false" ]; then
            echo "Release guard passed and no existing release found. Marking check as successful."
            exit 0
          else
            echo "::error::Release guard failed or release already exists. Marking check as failed."
            exit 1
          fi
