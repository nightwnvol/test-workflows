name: Release guard
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: write # TODO: need this?
jobs:
  release-guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.VERSION }}
      tag: ${{ steps.get-version.outputs.TAG }}
      release_exists: ${{ steps.check-release.outputs.result }}
    # if:startsWith(github.head_ref, 'release/')
    steps:
      - name: Debug APP_ID
        run: |
          echo "APP_ID length: ${#APP_ID}"
          echo "First 3 chars: ${APP_ID:0:3}"
        env:
          APP_ID: ${{ secrets.APP_ID }}
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.generate-token.outputs.token }}
      - name: Get package.json version
        id: get-version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
      - name: Check existing releases
        id: check-release
        uses: actions/github-script@v8
        env:
          TAG: ${{ steps.get-version.outputs.TAG }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const { check_release } = await import('${{ github.workspace }}/.github/scripts/release_guard.mjs');
            return await check_release({github, context, core});
          result-encoding: string
      - name: Comment on PR
        uses: actions/github-script@v8
        env:
          VERSION: ${{ steps.get-version.outputs.VERSION }}
          RELEASE_EXISTS: ${{ steps.check-release.outputs.result }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const { comment_on_pr } = await import('${{ github.workspace }}/.github/scripts/release_guard.mjs');
            await comment_on_pr({github, context, core});
  check-release-guard:
    needs: release-guard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Set status check conclusion
        run: |
          # if release-guard is successful and no release exists, mark check as successful
          if [ "${{ needs.release-guard.result }}" = "success" ] && [ "${{ needs.release-guard.outputs.release_exists }}" = "false" ]; then
            echo "Release guard passed and no existing release found. Marking check as successful."
            exit 0
          else
            echo "::error::Release guard failed or release already exists. Marking check as failed."
            exit 1
          fi
