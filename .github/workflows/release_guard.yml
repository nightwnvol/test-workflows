name: Release guard
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: write # TODO: need this?
jobs:
  release-guard:
    runs-on: ubuntu-latest
    # if:startsWith(github.head_ref, 'release/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Get package.json version
        id: get-version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
      - name: Check existing releases
        id: check-release
        uses: actions/github-script@v8
        env:
          TAG: ${{ steps.get-version.outputs.TAG }}
        with:
          script: |
            const { check_release } = await import('${{ github.workspace }}/.github/scripts/release_guard.mjs');
            return await check_release({github, context, core});
          result-encoding: string
      - name: Comment on PR
        uses: actions/github-script@v8
        env:
          VERSION: ${{ steps.get-version.outputs.VERSION }}
          RELEASE_EXISTS: ${{ steps.check-release.outputs.result }}
        with:
          script: |
            const { comment_on_pr } = await import('${{ github.workspace }}/.github/scripts/release_guard.mjs');
            await comment_on_pr({github, context, core});
      - name: Fail job if release already exists
        if: ${{ steps.check-release.outputs.result == 'true' }}
        run: |
          echo "A release for version ${{ steps.get-version.outputs.VERSION }} already exists. Failing the job."
          exit 1
