name: Deploy to preview
on:
  push:
    branches:
      - "release/**"
jobs:
  deploy-preview:
    if: contains(github.event.head_commit.message, '(deploy-preview)')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Deploy to preview
        run: |
          echo "Deploying to preview environment for ref ${{ github.ref }}"
          echo "Deployed successfully!"
  check-deploy-preview:
    needs: deploy-preview
    if: always()
    runs-on: ubuntu-latest
    env:
      DEPLOY_PREVIEW_RESULT: ${{ needs.deploy-preview.result }}
    steps:
      - name: Notify deployment status
        run: |
          if [ "${DEPLOY_PREVIEW_RESULT}" = "success" ]; then
            echo "Preview deployment succeeded. Marking check as successful."
            exit 0
          else
            echo "::error::Preview deployment failed or skipped. Marking check as failed."
            exit 1
          fi
