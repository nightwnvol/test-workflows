name: Deploy to production
on:
  pull_request:
    types: [closed]
    branches:
      - main
permissions:
  contents: write
  pull-requests: write
jobs:
  create-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.result }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: pr
      - name: Check branches
        run: |
          ls -la
      - name: Get package.json version from release branch
        id: get-version-package
        run: |
          cd pr
          echo "result=$(npm pkg get version | jq -r .)" >> $GITHUB_OUTPUT
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.12
      - name: Get pyproject.toml version from release branch
        id: get-version-pyproject
        run: |
          cd pr
          echo "result=$(uv version --short)" >> $GITHUB_OUTPUT
      - name: Check version consistency
        id: get-version
        env:
          VERSION_PACKAGE: ${{ steps.get-version-package.outputs.result }}
          VERSION_PYPROJECT: ${{ steps.get-version-pyproject.outputs.result }}
        run: |
          if [ "${VERSION_PACKAGE}" != "${VERSION_PYPROJECT}" ]; then
            echo "::error::Version mismatch between package.json (${VERSION_PACKAGE}) and pyproject.toml (${VERSION_PYPROJECT})."
            exit 1
          fi
          echo "Version is consistent: ${VERSION_PACKAGE}"
          echo "result=${VERSION_PACKAGE}" >> $GITHUB_OUTPUT
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Create new release
        id: create-release
        env:
          TAG: v${{ steps.get-version.outputs.result }}
          COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const { create_release } = await import('${{ github.workspace }}/main/.github/scripts/deploy_production.mjs');
            await create_release({github, context, core, tag: process.env.TAG, commit_sha: process.env.COMMIT_SHA});
  deploy-production:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Deploy to production
        run: |
          echo "Deploying to production environment for ref ${{ github.ref }}"
          echo "Deployed successfully!"
  sync-back:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Sync develop branch with main
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const { sync_back } = await import('${{ github.workspace }}/main/.github/scripts/deploy_production.mjs');
            await sync_back({github, context, core, version: process.env.VERSION, reviewers: ["nightwnvol"]});
