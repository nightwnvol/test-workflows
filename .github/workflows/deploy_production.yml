name: Deploy to production
on:
  pull_request:
    types: [closed]
    branches:
      - main
permissions:
  contents: write
  pull-requests: write
jobs:
  create-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.VERSION }}
      tag: ${{ steps.get-version.outputs.TAG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Get package.json version
        id: get-version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
      - name: Create new release
        id: create-release
        env:
          TAG: ${{ steps.get-version.outputs.TAG }}
          COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        uses: actions/github-script@v8
        with:
          script: |
            const { create_release } = await import('${{ github.workspace }}/.github/scripts/deploy_production.mjs');
            await create_release({github, context, core});
  deploy-production:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - name: Deploy to production
        run: |
          echo "Deploying version ${{ needs.create-release.outputs.version }} to production"
          echo "Deployed successfully!"
  sync-back:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
      - name: Sync develop branch with main
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        uses: actions/github-script@v8
        with:
          script: |
            const { sync_back } = await import('${{ github.workspace }}/.github/scripts/deploy_production.mjs');
            await sync_back({github, context, core});
