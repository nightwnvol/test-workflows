name: Check GitHub release
on:
  pull_request: # opened, synchronize, reopened
    branches: [main]
jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # alternative:
          # VERSION=$(npm pkg get version | tr -d '"')
      - name: Check if GitHub release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.get_version.outputs.VERSION }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh pr comment "$PR_NUMBER" --body "❌ **Release Check Failed**<br>Release with tag \`$TAG\` already exists on GitHub. Please bump the version in package.json before merging!"
            echo "::error::Release with tag $TAG already exists on GitHub. Please bump the version in package.json!"
            exit 1
          else
            gh pr comment "$PR_NUMBER" --body "✅ **Release Check Passed**<br>Tag \`$TAG\` is available. This PR is ready to merge."
            echo "Tag $TAG is available. Ready to merge."
          fi
