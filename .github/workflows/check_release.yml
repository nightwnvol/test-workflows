name: Check GitHub release
on:
  pull_request: # opened, synchronize, reopened
    branches: [main]
jobs:
  check-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # alternative:
          # VERSION=$(npm pkg get version | tr -d '"')
      - name: Check if GitHub release exists
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          TAG="v${{ steps.get_version.outputs.VERSION }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          MARKER="<!-- release-check-comment -->"
          EXISTING_COMMENT=$(gh pr view "$PR_NUMBER" --json comments --jq ".comments[] | select(.body | contains(\"$MARKER\")) | .id" | head -n 1)
          if gh release view "$TAG" > /dev/null 2>&1; then
            COMMENT_BODY="$MARKER❌ **Release Check Failed**Release with tag \`$TAG\` already exists on GitHub. Please bump the version in package.json before merging!"
            if [ -n "$EXISTING_COMMENT" ]; then
              gh api --method PATCH -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "/repos/${{ github.repository }}/issues/comments/$EXISTING_COMMENT" -f body="$COMMENT_BODY"
            else
              gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY"
            fi            
            echo "::error::Release with tag $TAG already exists on GitHub. Please bump the version in package.json!"
            exit 1
          else
            COMMENT_BODY="$MARKER✅ **Release Check Passed**Tag \`$TAG\` is available. This PR is ready to merge."
            if [ -n "$EXISTING_COMMENT" ]; then
              gh api --method PATCH -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "/repos/${{ github.repository }}/issues/comments/$EXISTING_COMMENT" -f body="$COMMENT_BODY"
            else
              gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY"
            fi
            echo "Tag $TAG is available. Ready to merge."
          fi
